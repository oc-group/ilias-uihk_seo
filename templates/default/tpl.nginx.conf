# A native PATH_INFO script already matches the PHP-FPM regex location first, unlike Apache.
error_page 404 {ILIAS_HTTP_PATH}/404/;

location = / {
    # nginx's index directive resolves the bare root to index.php before try_files below runs.
    rewrite ^ /Customizing/global/plugins/Services/UIComponent/UserInterfaceHook/Seo/go.php?page=/ last;
}

location / {
    # Serve existing files and directories directly.
    try_files $uri $uri/ @ilias_seo;
}

location @ilias_seo {
    # Check permalink and rewrite to the plugin.
    rewrite ^/(.*)$ /Customizing/global/plugins/Services/UIComponent/UserInterfaceHook/Seo/go.php?page=$1 last;
}
